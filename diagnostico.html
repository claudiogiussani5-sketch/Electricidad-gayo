<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico Gallo V88</title><style>body{font:16px system-ui;max-width:650px;margin:auto;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f4f4;padding:12px}</style></head><body><h2>Diagnóstico de instalación · Electricidad Gallo</h2><p>Esta página no modifica ni borra datos.</p><pre id="out">Comprobando...</pre><script>const out=document.querySelector('#out');let lines=[];function add(s){lines.push(s);out.textContent=lines.join('\n')}window.addEventListener('beforeinstallprompt',e=>{add('Evento de instalación disponible: SÍ');e.preventDefault()});(async()=>{add('Origen: '+location.origin);add('HTTPS: '+(location.protocol==='https:'));add('Standalone: '+matchMedia('(display-mode: standalone)').matches);add('User agent: '+navigator.userAgent);try{const reg=await navigator.serviceWorker.getRegistration('/');add('Service worker: '+(reg?.active?.state||'no activo'));add('Control de página: '+!!navigator.serviceWorker.controller)}catch(e){add('Service worker error: '+e.message)}try{const r=await fetch('/manifest.webmanifest',{cache:'no-store'});const m=await r.json();add('Manifest HTTP: '+r.status);add('Nombre: '+m.name);add('Start URL: '+new URL(m.start_url,location.href));add('Scope: '+new URL(m.scope,location.href));add('Display: '+m.display);for(const i of m.icons){const r=await fetch(i.src,{cache:'no-store'});add('Ícono '+i.sizes+' '+i.purpose+': '+r.status+' '+r.headers.get('content-type'))}}catch(e){add('Manifest error: '+e.message)}try{const r=await fetch('/',{cache:'no-store'});add('Inicio HTTP: '+r.status)}catch(e){add('Inicio error: '+e.message)}add('Esperá 15 segundos por si aparece evento de instalación.')})();</script></body></html>
